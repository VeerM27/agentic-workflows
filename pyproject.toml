[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflow"
version = "0.2.0"
description = "Declarative multi-agent workflows: specialised Claude agents that hand work to each other to build a product."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.3,<3",
    "pyyaml>=6.0",
    "pillow>=10",
]

[project.optional-dependencies]
# Lets agents screenshot the HTML they produce (used by the design reviewer).
render = ["playwright>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
agentflow = "agentflow.cli:main"

[tool.setuptools]
packages = ["agentflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

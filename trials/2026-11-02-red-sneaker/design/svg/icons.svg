<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 24" aria-hidden="true" focusable="false">
  <!-- Small UI icons, 24 x 24 each, stroke = currentColor. Inline the one you need.
       chevron: scroll cue. check: completed step dot and success status. alert: size error. -->
  <g id="icon-chevron" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6,9 L12,15 L18,9"/>
  </g>
  <g id="icon-check" transform="translate(24 0)" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5,12.5 L10,17 L19,7"/>
  </g>
  <g id="icon-alert" transform="translate(48 0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12,7.5 V13"/>
    <path d="M12,16.5 V16.6"/>
  </g>
</svg>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frame: static list (reduced motion, no JS, ?build=static)</title>
<link rel="icon" href="../svg/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="frames.css">
</head>
<body>
<a class="skip-link" href="#build">Skip to content</a>
<header class="topbar">
  <a class="wordmark" href="#build"><span data-mark></span>Ember Low</a>
  <a class="topbar__buy" href="#product">Skip to buy</a>
</header>
<main>
  <!-- Same component, --p fixed to the snap values. No sticky stage, no pinned track, no motion.
       The shoe is aria-hidden here: the figcaption carries the content. -->
  <section class="static-build" id="build" aria-labelledby="build-title">
    <div class="static-build__intro">
      <h1 class="display" id="build-title">Built layer by layer.</h1>
      <p>Five parts. One everyday sneaker. Here is how it comes together.</p>
    </div>
    <ol>
      <li id="step-1">
        <figure class="static-step build" style="--p: 0.20">
          <div class="build__sheet sheet"><div data-shoe aria-hidden="true"></div></div>
          <figcaption><span class="caption__step">Step 1 of 5</span><span class="caption__part display">Sole</span><span class="caption__body">A flat rubber sole with a single black stripe.</span></figcaption>
        </figure>
      </li>
      <li id="step-2">
        <figure class="static-step build" style="--p: 0.36">
          <div class="build__sheet sheet"><div data-shoe aria-hidden="true"></div></div>
          <figcaption><span class="caption__step">Step 2 of 5</span><span class="caption__part display">Toe cap and sidewall</span><span class="caption__body">A rubber toe cap and sidewall that wipe clean.</span></figcaption>
        </figure>
      </li>
      <li id="step-3">
        <figure class="static-step build" style="--p: 0.58">
          <div class="build__sheet sheet"><div data-shoe aria-hidden="true"></div></div>
          <figcaption><span class="caption__step">Step 3 of 5</span><span class="caption__part display">Canvas upper</span><span class="caption__body">Red canvas, stitched in contrast thread.</span></figcaption>
        </figure>
      </li>
      <li id="step-4">
        <figure class="static-step build" style="--p: 0.665">
          <div class="build__sheet sheet"><div data-shoe aria-hidden="true"></div></div>
          <figcaption><span class="caption__step">Step 4 of 5</span><span class="caption__part display">Insole and lining</span><span class="caption__body">A soft fabric lining and insole, tan and plain.</span></figcaption>
        </figure>
      </li>
      <li id="step-5">
        <figure class="static-step build" style="--p: 1">
          <div class="build__sheet sheet"><div data-shoe role="img" aria-label="The finished sneaker from the side: red canvas upper, white rubber sole with a black stripe, white laces through six metal eyelets."></div></div>
          <figcaption><span class="caption__step">Step 5 of 5</span><span class="caption__part display">Eyelets and laces</span><span class="caption__body">Six pairs of metal eyelets and flat white laces.</span></figcaption>
        </figure>
      </li>
    </ol>
  </section>
</main>
<script src="frame.js"></script>
</body>
</html>
